services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: statistics
      POSTGRES_PASSWORD: statistics
      POSTGRES_DB: statistics
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - statistics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statistics -d statistics"]
      interval: 5s
      retries: 10
volumes:
  statistics_data:
